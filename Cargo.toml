[workspace]
resolver = "2"
members = ["api", "shared"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/21gifts/api"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
secp256k1 = { version = "0.29", features = ["serde", "rand-std", "global-context"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
