name: Deploy DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DOCKER_TAGS: 21gifts/api:beta

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push :beta
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/arm64
          cache-from: type=registry,ref=21gifts/api:buildcache
          cache-to: type=registry,ref=21gifts/api:buildcache,mode=max

      - name: Notify infrastructure to pull :beta
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ secrets.DISPATCH_REPO }}"
          if [ -z "${GH_TOKEN}" ] || [ -z "${repo}" ]; then
            echo "::warning::DISPATCH_TOKEN or DISPATCH_REPO unset — infra probe-published-images.yml will pick up the tag"
            exit 0
          fi
          gh api "repos/${repo}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=21gifts/api" \
            -f "client_payload[tag]=beta" \
            -f "client_payload[sha]=${GITHUB_SHA}"
