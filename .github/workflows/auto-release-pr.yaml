name: Auto Release PR

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release branches
        run: |
          git fetch origin main || true
          git fetch origin develop || true
          git fetch origin staging || true

      - name: Create Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/develop)
              base=staging
              head=develop
              title='Release: develop -> staging'
              ready='Merge when ready for staging'
              ;;
            refs/heads/staging)
              base=main
              head=staging
              title='Release: staging -> main'
              ready='Merge when ready for production'
              ;;
            *)
              echo "::notice::Ref ${GITHUB_REF} is not a release branch; skipping"
              exit 0
              ;;
          esac

          if ! git rev-parse --verify --quiet "origin/staging" >/dev/null; then
            echo "::notice::origin/staging is missing; not opening a release PR"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "origin/${base}" >/dev/null; then
            echo "::notice::origin/${base} is missing; not opening a release PR"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "origin/${head}" >/dev/null; then
            echo "::notice::origin/${head} is missing; not opening a release PR"
            exit 0
          fi

          pr_count="$(gh pr list --base "${base}" --head "${head}" --state open --json number --jq 'length')"
          if [ "${pr_count}" -gt 0 ]; then
            exit 0
          fi

          diff_count="$(git rev-list --count "origin/${base}..origin/${head}")"
          if [ "${diff_count}" -le 0 ]; then
            exit 0
          fi

          printf '%s\n' \
            "## Automatic Release PR" \
            "" \
            "**Commits:** ${diff_count} new commit(s)" \
            "" \
            "- [ ] Review all changes" \
            "- [ ] Verify CI passes" \
            "- [ ] ${ready}" \
            > /tmp/pr-body.md

          gh pr create \
            --base "${base}" \
            --head "${head}" \
            --title "${title}" \
            --body-file /tmp/pr-body.md
