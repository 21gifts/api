name: Auto Release PR

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release branches
        run: |
          git fetch origin main || true
          git fetch origin develop || true
          git fetch origin staging || true

      - name: Open missing release pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for HEAD_BRANCH in develop staging; do
            if ! git rev-parse --verify "origin/${HEAD_BRANCH}" >/dev/null 2>&1; then
              echo "skip ${HEAD_BRANCH}: branch is not on origin"
              continue
            fi
            if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
              echo "skip ${HEAD_BRANCH}: main is not on origin"
              continue
            fi
            PR_COUNT="$(gh pr list --base main --head "${HEAD_BRANCH}" --state open --json number --jq 'length')"
            if [ "${PR_COUNT}" -gt 0 ]; then
              echo "release pull request for ${HEAD_BRANCH} is already open"
              continue
            fi
            DIFF_COUNT="$(git rev-list --count "origin/main..origin/${HEAD_BRANCH}")"
            if [ "${DIFF_COUNT}" -eq 0 ]; then
              echo "no commits on ${HEAD_BRANCH} beyond main"
              continue
            fi
            printf '%s\n' \
              "## Automatic Release PR" \
              "" \
              "**Commits:** ${DIFF_COUNT} new commit(s)" \
              "" \
              "- [ ] Review all changes" \
              "- [ ] Verify CI passes" \
              "- [ ] Merge when ready for production" \
              > "/tmp/pr-body-${HEAD_BRANCH}.md"
            gh pr create \
              --base main \
              --head "${HEAD_BRANCH}" \
              --title "Release: ${HEAD_BRANCH} -> main" \
              --body-file "/tmp/pr-body-${HEAD_BRANCH}.md"
          done
