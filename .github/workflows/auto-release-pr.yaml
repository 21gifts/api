name: Auto Release PR

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release branches
        run: |
          git fetch origin main || true
          git fetch origin develop || true
          git fetch origin staging || true

      - name: Open missing release pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_release() {
            local head="$1"
            local base="$2"
            local ready_for="$3"
            local require_file_diff="$4"
            if ! git rev-parse --verify "origin/${head}" >/dev/null 2>&1; then
              echo "skip ${head}: branch is not on origin"
              return 0
            fi
            if ! git rev-parse --verify "origin/${base}" >/dev/null 2>&1; then
              echo "skip ${head}: ${base} is not on origin"
              return 0
            fi
            local pr_count
            pr_count="$(gh pr list --base "${base}" --head "${head}" --state open --json number --jq 'length')"
            if [ "${pr_count}" -gt 0 ]; then
              echo "release pull request for ${head} into ${base} is already open"
              return 0
            fi
            local diff_count
            diff_count="$(git rev-list --count "origin/${base}..origin/${head}")"
            if [ "${diff_count}" -eq 0 ]; then
              echo "no commits on ${head} beyond ${base}"
              return 0
            fi
            if [ "${require_file_diff}" = "true" ] && git diff --quiet "origin/${base}...origin/${head}"; then
              echo "no file changes on ${head} beyond ${base}"
              return 0
            fi
            printf '%s\n' \
              "## Automatic Release PR" \
              "" \
              "**Commits:** ${diff_count} new commit(s)" \
              "" \
              "- [ ] Review all changes" \
              "- [ ] Verify CI passes" \
              "- [ ] Merge when ready for ${ready_for}" \
              > "/tmp/pr-body-${head}.md"
            gh pr create \
              --base "${base}" \
              --head "${head}" \
              --title "Release: ${head} -> ${base}" \
              --body-file "/tmp/pr-body-${head}.md"
          }
          # Hard requirement: staging is experimental testing. Release it
          # into develop, and release develop into main. Never open a
          # release from staging directly into main.
          open_release develop main production false
          open_release staging develop develop true
